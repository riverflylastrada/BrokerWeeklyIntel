name: PMS Pulse - monthly SEBI refresh

on:
  schedule:
    # 14th of each month 09:00 IST (03:30 UTC): SEBI monthly PMS reports for the previous month are out by then
    - cron: '30 3 14 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pms:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PMS run (SEBI + Apify low and slow + ingest category=pms)
        working-directory: pms
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          pip install 'apify-client>=1.7,<2'
          python run_pms.py
      - name: Commit PMS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pms/sebi_monthly.json pms/pms_report.json pms/pms_site.json || true
          git commit -m "chore: PMS data refresh" || echo "No changes"
          git pull --rebase && git push
